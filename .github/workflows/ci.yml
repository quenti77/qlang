name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:

jobs:
  # The three systems run on main and on the release branches. A pull request runs on Linux only, unless it
  # touches what depends on the system (the installers, processes, the terminal, packaging).
  systems:
    name: Systems to test
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          only='["ubuntu-latest"]'
          if [ "$EVENT" != pull_request ]; then
            echo "os=$all" >> "$GITHUB_OUTPUT"
          elif gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only |
            grep -qE '^(install\.(sh|ps1)|packaging/|crates/qlang-core/src/host\.rs|crates/qlang-cli/src/(process|term|install|selfupdate|archive|stop|packages|registry)\.rs)'; then
            echo "os=$all" >> "$GITHUB_OUTPUT"
          else
            echo "os=$only" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust tests (${{ matrix.os }})
    needs: systems
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.systems.outputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
      - name: install.sh against a fake release
        if: runner.os != 'Windows'
        run: scripts/test-install.sh
      - name: update-package-repos.sh against local repositories
        if: runner.os != 'Windows'
        run: scripts/test-update-package-repos.sh

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p qlang-cli
      - name: The documentation matches the program
        run: scripts/check-docs.py
      # the cases are in their own repository: at the tag named in conformance.ref, or (pull request) on the
      # branch that has the same name there (scripts/conformance-ref.sh)
      - name: conformance.ref is a tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/conformance-ref.sh --check-tag
      - name: Fetch the cases
        run: git clone --depth 1 --branch "$(scripts/conformance-ref.sh)" https://github.com/quenti77/qlang-conformance.git ../qlang-conformance
      - name: Run them against this build
        working-directory: ../qlang-conformance
        run: QLANG="$GITHUB_WORKSPACE/target/release/qlang" "$GITHUB_WORKSPACE/target/release/qlang" run --allow-process run.q

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  redis:
    name: Redis client against a server
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      QLANG_TEST_REDIS: redis://127.0.0.1:6379/9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --release -p qlang-cli --test redis

  msrv:
    name: Oldest supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p qlang-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test crates/qlang-wasm/test/*.test.mjs

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # the extension tests run the real compiler
      - run: cargo build --release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
