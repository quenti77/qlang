name: Fuzz

# A long sweep of the mutation test (crates/qlang-core/tests/mutation_fuzz.rs) with a new seed
# each time: damaged programs must be refused, never panic the compiler or the formatter. A
# failure prints the program and the seed to replay it with QLANG_FUZZ_SEED.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Number of mutated programs"
        default: "30000"
      seconds:
        description: "Seconds of coverage-guided fuzzing per target"
        default: "600"
  schedule:
    - cron: "21 3 * * 0"
  # a short run of every target when the code they read or the targets change
  pull_request:
    paths:
      - fuzz/**
      - crates/qlang-core/src/lexer.rs
      - crates/qlang-core/src/parser.rs
      - crates/qlang-core/src/fmt.rs
      - crates/qlang-cli/src/serve.rs
      - crates/qlang-cli/src/ws.rs
      - .github/workflows/fuzz.yml

permissions:
  contents: read

jobs:
  mutation:
    if: github.event_name != 'pull_request'
    name: Mutation sweep (compiler and formatter)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --release -p qlang-core --test mutation_fuzz
        env:
          QLANG_FUZZ_ROUNDS: ${{ inputs.rounds || '30000' }}
          QLANG_FUZZ_SEED: ${{ github.run_id }}

  # cargo-fuzz (libFuzzer, guided by coverage): the lexer, the parser, the whole front end, the formatter, the
  # interpreter under small limits, and what `qlang serve` reads from the network (HTTP requests, the path of a
  # static file, WebSocket frames). A crash is kept as an artifact: replay it with `cargo +nightly fuzz run
  # <target> <file>` in fuzz/.
  guided:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: lexer, seeds: lang, len: 2048 }
          - { target: parser, seeds: lang, len: 2048 }
          - { target: format, seeds: lang, len: 2048 }
          - { target: compile, seeds: lang, len: 2048 }
          - { target: run, seeds: lang, len: 1024 }
          - { target: http_request, seeds: http, len: 4096 }
          - { target: http_static, seeds: http, len: 256 }
          - { target: ws_frame, seeds: ws, len: 4096 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: fuzz
        env:
          # the interpreter keeps reference cycles for good: only crashes and failed assertions matter here
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p corpus/${{ matrix.target }}
          seconds="${{ inputs.seconds }}"
          if [ "${{ github.event_name }}" = pull_request ]; then seconds=20; fi
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.seeds }} -- \
            -max_total_time="${seconds:-600}" -max_len=${{ matrix.len }} -timeout=20
      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
