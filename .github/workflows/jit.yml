name: JIT targets

# The native code (Cranelift) must build and run on every release target.
on:
  pull_request:
    paths:
      - 'crates/qlang-core/src/interp/vm/jit.rs'
      - 'crates/qlang-core/Cargo.toml'
      - 'crates/qlang-cli/Cargo.toml'
      - '.github/workflows/jit.yml'

jobs:
  jit:
    name: JIT on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: aarch64-apple-darwin, os: macos-15, run: true }
          - { target: x86_64-apple-darwin, os: macos-15, run: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p qlang-cli --target ${{ matrix.target }}
      - if: matrix.run
        run: cargo test --release -p qlang-core --features jit --test jit_cases --target ${{ matrix.target }}
        env:
          QLANG_JIT_HOT: '1'
