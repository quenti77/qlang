name: Release

# Push a tag `vX.Y.Z` to publish a release: prebuilt programs for Linux, macOS and Windows,
# their checksums, the browser build (qlang.wasm), the VS Code extension, the manifests for
# Homebrew / Scoop / the AUR, and the Docker image (ghcr.io/quenti77/qlang). Changes to the
# release files build everything on the pull request too (nothing is published then).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - crates/qlang-wasm/**
      - .cargo/**
      - install.sh
      - Cargo.toml
      - Dockerfile
      - packaging/**
      - install.ps1
      - editors/vscode/package.json

permissions:
  contents: read

jobs:
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          extension=$(node -p "require('./editors/vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo workspace: $version, VS Code extension: $extension"
          if [ "$version" != "$extension" ]; then
            echo "::error::The VS Code extension version ($extension) differs from the Cargo version ($version)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p qlang-cli --target ${{ matrix.target }}
      - name: Run the program once (when the runner can)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/qlang
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          printf 'print(6 * 7)\n' > smoke.q
          "$exe" run smoke.q
      - name: Package
        shell: bash
        run: scripts/package-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: Build for the browser
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p qlang-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test crates/qlang-wasm/test/*.test.mjs
      - run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/wasm/qlang_wasm.wasm dist/qlang.wasm
          cp crates/qlang-wasm/js/qlang.mjs dist/qlang.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wasm
          path: dist/*
          if-no-files-found: error

  extension:
    name: Package the VS Code extension
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npx vsce package --allow-missing-repository -o "$GITHUB_WORKSPACE/dist/qlang.vsix"
        working-directory: editors/vscode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-vsix
          path: dist/qlang.vsix
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [build, wasm, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # for the signed build provenance below
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Manifests for the package managers
        run: |
          source/scripts/render-packaging.sh "$GITHUB_REF_NAME" dist/SHA256SUMS dist
          cp source/install.sh source/install.ps1 dist/
          (cd dist && sha256sum qlang.rb qlang.json PKGBUILD install.sh install.ps1 >> SHA256SUMS)
      - name: Attest where the files come from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "qlang ${GITHUB_REF_NAME#v}" \
            --generate-notes

  docker:
    name: Docker image
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*linux*
          merge-multiple: true
          path: archives
      - name: The two Linux programs
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar -xzf archives/qlang-x86_64-unknown-linux-musl.tar.gz -C archives
          cp archives/qlang/qlang dist/linux-amd64/qlang
          rm -rf archives/qlang
          tar -xzf archives/qlang-aarch64-unknown-linux-musl.tar.gz -C archives
          cp archives/qlang/qlang dist/linux-arm64/qlang
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: mode=max
