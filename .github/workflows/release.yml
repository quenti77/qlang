name: Release

# Push a tag `vX.Y.Z` to publish a release: prebuilt programs for Linux and macOS, their
# checksums, the browser build (qlang.wasm) and the VS Code extension. (No Windows build for now: it is compiled from the
# sources, but the tests still run on Windows in ci.yml.) Changes to the release files
# build everything on the pull request too (nothing is published then).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - crates/qlang-wasm/**
      - .cargo/**
      - install.sh
      - Cargo.toml
      - editors/vscode/package.json

permissions:
  contents: read

jobs:
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          extension=$(node -p "require('./editors/vscode/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo workspace: $version, VS Code extension: $extension"
          if [ "$version" != "$extension" ]; then
            echo "::error::The VS Code extension version ($extension) differs from the Cargo version ($version)"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p qlang-cli --target ${{ matrix.target }}
      - name: Run the program once (when the runner can)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/qlang
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          printf 'print(6 * 7)\n' > smoke.q
          "$exe" run smoke.q
      - name: Package
        shell: bash
        run: scripts/package-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: Build for the browser
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p qlang-wasm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test crates/qlang-wasm/test/*.test.mjs
      - run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/wasm/qlang_wasm.wasm dist/qlang.wasm
          cp crates/qlang-wasm/js/qlang.mjs dist/qlang.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-wasm
          path: dist/*
          if-no-files-found: error

  extension:
    name: Package the VS Code extension
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npx vsce package --allow-missing-repository -o "$GITHUB_WORKSPACE/dist/qlang.vsix"
        working-directory: editors/vscode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-vsix
          path: dist/qlang.vsix
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [build, wasm, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # for the signed build provenance below
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where the files come from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "qlang ${GITHUB_REF_NAME#v}" \
            --generate-notes
