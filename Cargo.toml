[workspace]
resolver = "3"
members = ["crates/qlang-core", "crates/qlang-cli", "crates/qlang-wasm"]

[workspace.package]
version = "1.3.1"
edition = "2024"
# rustyline 19 needs 1.95 (cfg_select!), rusqlite 0.41 needs 1.89
rust-version = "1.95"
license = "MIT"

# The browser build: speed and size matter more than build time.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
strip = true
